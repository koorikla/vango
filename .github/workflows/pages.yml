name: Deploy to GitHub Pages

# GitHub only serves Pages from a private repo on Pro/Team/Enterprise plans.
# While the repo is private on a Free plan, Pages cannot be enabled — so the
# guard job below checks first and the rest of the workflow skips cleanly
# instead of failing every push. Enable Pages (Settings > Pages > Source:
# GitHub Actions) and this starts deploying on its own, no edit needed.
#
# The long-term target is Cloudflare Pages, which builds private repos on the
# free plan and honours static/_redirects. This workflow is the interim host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0

jobs:
  guard:
    name: Is Pages enabled?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not enabled for this repository — skipping deploy."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      # Pages serves from a /<repo>/ subpath, so the production baseURL in
      # hugo.toml (https://vango.ee/) has to be overridden at build time.
      # hugo.toml stays correct for Cloudflare.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
        env:
          HUGO_ENVIRONMENT: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
