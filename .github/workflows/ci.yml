name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the hugo version used locally (hugo version).
  HUGO_VERSION: 0.165.0

jobs:
  build:
    name: Hugo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      # On a clean runner Hugo re-encodes every derivative from scratch —
      # ~130 photographs into AVIF, WebP and JPEG at four widths each — and
      # that is essentially the whole of the build's wall time. Locally it is
      # 15s cold against 0.2s with this cache present, and a runner is slower
      # than a laptop. The cache is 35 MB, against 10 GB per repository on
      # the free plan, and GitHub drops entries a week after their last use.
      #
      # The key covers what actually decides a derivative: the source
      # pictures, and the processing specs written in the templates and in
      # [imaging]. restore-keys is doing more work than the key here — on a
      # miss it pulls the newest cache anyway and Hugo regenerates only what
      # genuinely changed, while `--gc` prunes whatever is no longer
      # referenced, so what gets saved stays the size of the site rather
      # than the size of its history.
      - name: Cache Hugo's processed images
        uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-gen-${{ runner.os }}-${{ hashFiles('assets/img/**', 'content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'layouts/**', 'hugo.toml') }}
          restore-keys: |
            hugo-gen-${{ runner.os }}-

      # Builds against the production baseURL from hugo.toml. The deploy
      # workflow rebuilds with whatever baseURL the target host needs.
      - name: Build
        run: hugo --gc --minify --printPathWarnings
        env:
          HUGO_ENVIRONMENT: production

      - name: Summarise output
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh public >> "$GITHUB_STEP_SUMMARY"
          find public -name '*.html' | wc -l | xargs echo "HTML pages:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The Playwright suite starts `hugo server` itself (see playwright.config.js),
  # so it needs Hugo and node but no artifact from the build job.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for specs
        id: check
        run: |
          if compgen -G "tests/*.spec.js" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No specs in tests/ yet — skipping the E2E run."
          fi

      - name: Install Hugo
        if: steps.check.outputs.found == 'true'
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      # Restore only. This job runs `hugo server`, which has no `--gc`, so
      # letting it write the cache back would save an unpruned one. The build
      # job above owns saving it.
      - name: Restore Hugo's processed images
        if: steps.check.outputs.found == 'true'
        uses: actions/cache/restore@v6
        with:
          path: resources/_gen
          key: hugo-gen-${{ runner.os }}-${{ hashFiles('assets/img/**', 'content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'layouts/**', 'hugo.toml') }}
          restore-keys: |
            hugo-gen-${{ runner.os }}-

      - uses: actions/setup-node@v7
        if: steps.check.outputs.found == 'true'
        with:
          node-version: 22
          cache: npm

      # The browser binary is ~130 MB and does not change between runs; the
      # OS packages it links against are installed outside the cached path,
      # so they are laid down again either way.
      - name: Cache the Playwright browser
        if: steps.check.outputs.found == 'true'
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.check.outputs.found == 'true'
        run: |
          npm install
          if [ "${{ steps.browser.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright
        if: steps.check.outputs.found == 'true'
        run: npm test

      - name: Upload report
        if: steps.check.outputs.found == 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
