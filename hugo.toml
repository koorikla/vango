baseURL = "https://vango.ee/"
defaultContentLanguage = "et"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# no theme: layouts live in this repo, so there is nothing extra to keep upgraded
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.et]
    locale = "et-EE"
    label = "Eesti"
    weight = 1
    title = "Vango Imedemaa"
    contentDir = "content/et"
    # :slug derives the URL from the title in each language (override per page
    # with `slug:` in front matter). Declared for both languages so the two
    # behave identically.
    [languages.et.permalinks.page]
      ruumid = "/ruumid/:slug/"
      uudised = "/uudised/:slug/"
      sundmused = "/sundmused/:slug/"
      galerii = "/galerii/:slug/"

  [languages.en]
    locale = "en-GB"
    label = "English"
    weight = 2
    title = "Vango Wonderland"
    contentDir = "content/en"
    # Content directories keep the Estonian names in both languages so a page
    # and its translation sit at the same path; only the public URL differs.
    [languages.en.permalinks.section]
      uudised = "/news/"
      sundmused = "/events/"
      galerii = "/gallery/"
    [languages.en.permalinks.page]
      # The section keeps its Estonian name here, unlike the three below.
      # /en/ruumid/<slug>/ is the path WordPress published and Google indexed;
      # the slugs within it have been renamed to match each room (with 301s in
      # static/_redirects), which is the part a reader actually sees. Moving
      # the section as well would double the redirect churn for no gain.
      ruumid = "/ruumid/:slug/"
      uudised = "/news/:slug/"
      sundmused = "/events/:slug/"
      galerii = "/gallery/:slug/"

[pagination]
  pagerSize = 12

[outputs]
  home = ["HTML"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true   # room bodies are trusted HTML lifted from the old site

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 80
  [imaging.webp]
    quality = 80

# Rooms now render their own pages as well as appearing on the one-pager.
# They previously carried `render = "never"`; each room is a distinct thing
# with its own name, photographs and capacity, and a page it can be found by
# is worth more than the tidiness of keeping everything on one URL.

# The fonts are self-hosted rather than pulled from Google, so an embedded
# video should not quietly undo that. Privacy-enhanced mode points the
# `youtube` shortcode at youtube-nocookie.com, which sets no tracking cookie
# until the viewer actually presses play.
[privacy]
  [privacy.youtube]
    privacyEnhanced = true

[params]
  facebook = "https://www.facebook.com/vangoimedemaa"
  instagram = "https://www.instagram.com/vangotalu/"
  email = "info@vango.ee"

[minify]
  minifyOutput = true
